<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
</head>

<body>

<div id="remote">

  <!-- ================= POWER ================= -->
  <div class="row">
    <button data-key="DISK_EJECT">⏏</button>
    <button data-key="POWER">⏻</button>
    <button data-key="DISPLAY" class="text">DISPLAY</button>
  </div>

  <!-- ================= NAVIGATION ================= -->
  <div class="row">
    <button data-key="TOP_MENU" class="text">TOP MENU</button>
    <button data-key="POP_UP" class="text">POPUP MENU</button>
  </div>
  
  <div class="dpad">
    <button data-key="SETUP" class="text">SETUP</button>
    <button data-key="OSC" class="text">OSC</button>
    <button data-key="QUICK" class="text">QUICK</button>

    <button data-key="UP">⯅</button>
    <button data-key="LEFT">⯇</button>
    <button data-key="OK" class="ok">OK</button>
    <button data-key="RIGHT">⯈</button>
    <button data-key="DOWN">⯆</button>
    
    <button data-key="BACK" class="text">BACK</button>
    <button data-key="RETURN" class="text">BACK</button>
    <button data-key="EXIT" class="text">EXIT</button>
  </div>

  <div class="row">
    <button data-key="MENU" class="text">MENU</button>
  </div>

  <!-- ================= MEDIA CONTROLS ================= -->
  <div class="row media">
    <button data-key="BACK_SKIP">⏮</button>
    <button data-key="PLAY">⯈</button>
    <button data-key="PAUSE">⏸</button>
    <button data-key="SKIP">⏭</button>
  </div>

  <div class="row media">
    <button data-key="FAST_REWIND">⏪︎</button>
    <button data-key="STOP">⏹</button>
    <button data-key="STEP" class="half">🞂🭰</button>
    <button data-key="SLOW_FWD" class="half">🠶</button>
    <button data-key="FAST_FORWARD">⏩︎</button>
  </div>
  
  <div class="row media">
    <button data-key="SUBTITLE" class="text">SUB TITLE</button>
    <button data-key="AUDIO" class="text">AUDIO</button>
    <button data-key="ANGLE" class="text">ANGLE</button>
  </div>

  <!-- ================= VOLUME / CHANNEL ================= -->
  <div class="row">
    <button data-key="VOL_DOWN">🔉</button>
    <button data-key="VOL_UP">🔊</button>

    <button data-key="CH_DOWN">CH -</button>
    <button data-key="CH_UP">CH +</button>
  </div>

  <!-- ================= NUMBERS ================= -->
  <div class="num-grid">
    <button data-key="ONE">1</button>
    <button data-key="TWO">2</button>
    <button data-key="THREE">3</button>

    <button data-key="FOUR">4</button>
    <button data-key="FIVE">5</button>
    <button data-key="SIX">6</button>

    <button data-key="SEVEN">7</button>
    <button data-key="EIGHT">8</button>
    <button data-key="NINE">9</button>

    <button data-key="GOTO" class="text">GOTO</button>
    <button data-key="ZERO">0</button>
    <button data-key="CLEAR" class="text">CLEAR</button>
  </div>

  <!-- ================= COLOR KEYS ================= -->
  <div class="row colors">
    <button data-key="RED">🔴</button>
    <button data-key="GREEN">🟢</button>
    <button data-key="YELLOW">🟡</button>
    <button data-key="BLUE">🔵</button>
  </div>

  <!-- ================= CONNECTED TV ================= -->
  <div class="row">
    <button data-key="GUIDE" class="text">GUIDE</button>
    <button data-key="LIST" class="text">LIST</button>
    <button data-key="INFO" class="text">INFO</button>
  </div>
  <div class="row">
    <button data-key="MC" class="text">MC</button>
    <button data-key="HOME" class="text">HOME</button>
    <button data-key="START_MENU" class="text">START MENU</button>
  </div>
  <div class="row">
    <button data-key="CONNECTED" class="text">CONN.</button>
    <button data-key="NETFLIX" class="text">NETFLIX</button>
  </div>

</div>

<script src="popup.js"></script>
</body>
</html>
