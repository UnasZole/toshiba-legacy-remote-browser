<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Toshiba Remote Settings</title>
</head>
<body>

<h2>Settings</h2>

<label>Host</label><br>
<input id="host"><br><br>

<label>Port</label><br>
<input id="port" value="80"><br><br>

<label>User</label><br>
<input id="user"><br><br>

<label>Password</label><br>
<input id="password" type="password"><br><br>

<label>Keymap</label><br>
<select id="keymap">
  <option value="0">TV</option>
  <option value="1">Recorder</option>
  <option value="2">Alt TV</option>
  <option value="3">Alt Recorder</option>
  <option value="4">Smart TV</option>
  <option value="5">BluRay</option>
</select>

<br><br>

<button id="save">Save</button>

<script src="options.js"></script>
</body>
</html>
